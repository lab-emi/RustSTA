# Lowered propagation backends verification suite (docs/specs/sta/lowering.md).
# Run the CPU suites with `cargo test -p ruststa --test backend_equality` and the GPU suites with
# `cargo test -p ruststa --features cuda --test backend_equality -- --include-ignored`.

[[suite]]
name = "sta-backends"
requirement = [
    "STA-REQ-0400",
    "STA-REQ-0401",
    "STA-REQ-0402",
    "STA-REQ-0403",
    "STA-REQ-0404",
    "STA-REQ-0405",
    "STA-REQ-0406",
    "STA-REQ-0407",
    "STA-REQ-0408",
]
test = "crates/engines/ruststa/tests/backend_equality.rs"
description = "level-parallel CPU bitwise identity across 1, 3 and 8 threads on the corpus and generated three-state netlists; CUDA f64 bitwise identity with CPU on the 32 corpus netlists, latches and two clocks; CUDA f32 within the STA-REQ-0403 envelope; bit-identical GPU reruns; prewarm overlap; missing runtimes and retired legacy GPU flags reported as errors (the GPU tests need a GPU: cargo xtask verify sta --gpu)"
