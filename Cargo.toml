[workspace]
resolver = "3"
members = ["crates/*/*", "xtask"]

[workspace.package]
version = "0.4.3"
edition = "2024"
rust-version = "1.100"
license = "Apache-2.0"
publish = false
authors = ["RustSTA contributors"]
repository = "https://github.com/lab-emi/RustSTA"

[workspace.dependencies]
rusteda-core = { git = "https://github.com/lab-emi/RustEDA-Common.git", rev = "3aaf6cd38948c58b33ab0d14466c8f301292ca5e" }
rusteda-workspace = { git = "https://github.com/lab-emi/RustEDA-Common.git", rev = "3aaf6cd38948c58b33ab0d14466c8f301292ca5e" }
rusteda-compute = { git = "https://github.com/lab-emi/RustEDA-Common.git", rev = "3aaf6cd38948c58b33ab0d14466c8f301292ca5e" }
rusteda-formats = { git = "https://github.com/lab-emi/RustEDA-Common.git", rev = "3aaf6cd38948c58b33ab0d14466c8f301292ca5e" }
rusteda-cli-shared = { package = "rusteda-cli-common", git = "https://github.com/lab-emi/RustEDA-Common.git", rev = "3aaf6cd38948c58b33ab0d14466c8f301292ca5e" }
ruststa = { path = "crates/engines/ruststa" }
ruststa-check = { path = "crates/verify/ruststa-check" }
ruststa-fixtures = { path = "crates/verify/ruststa-fixtures" }
clap = { version = "=4.6.7", default-features = false, features = ["std", "derive", "help", "usage", "error-context", "color", "suggestions"] }
clap_complete = { version = "=4.6.11", default-features = false }
serde = { version = "=1.0.228", features = ["derive"] }
# float_roundtrip: the decimal text of a stored f64 parses back to the same value.
serde_json = { version = "=1.0.149", features = ["float_roundtrip"] }
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }
libc = "=0.2.189"
thiserror = "=2.0.18"
rayon = "=1.12.0"
rustc-hash = "=2.1.2"
# Plain-record views of the frozen netlist tables and the compute task interface.
bytemuck = { version = "=1.25.2", features = ["derive"] }
xxhash-rust = { version = "=0.8.19", default-features = false, features = ["xxh3"] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
print_stdout = "warn"
too_many_arguments = "allow"
module_inception = "allow"
# Style preferences of this code base.
collapsible_if = "allow"
type_complexity = "allow"
needless_range_loop = "allow"

[profile.release]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2

[profile.test]
opt-level = 1
